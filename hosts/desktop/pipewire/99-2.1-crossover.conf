context.modules = [

    # ============================================================
    # Main output: transparent full-range pass-through
    # ============================================================
    {
        name = libpipewire-module-filter-chain

        args = {
            node.description = "Desktop 2.1 Main"

            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = copy_fl
                        label = copy
                    }
                    {
                        type  = builtin
                        name  = copy_fr
                        label = copy
                    }
                ]
                inputs  = [ "copy_fl:In" "copy_fr:In" ]
                outputs = [ "copy_fl:Out" "copy_fr:Out" ]
            }

            capture.props = {
                node.name        = "desktop_21_main"
                node.description = "Desktop 2.1 Main"
                media.class      = Audio/Sink

                audio.channels = 2
                audio.position = [ FL FR ]
            }

            playback.props = {
                node.name        = "desktop_21_main_output"
                node.description = "Desktop 2.1 Main Output"

                node.passive       = true
                node.dont-fallback = true

                audio.channels = 2
                audio.position = [ FL FR ]

                stream.dont-remix = true

                target.object = "alsa_output.usb-Generic_USB_Audio-00.HiFi__Speaker__sink"
            }
        }
    }


    # ============================================================
    # Sub output: 4th-order / 24 dB/oct low-pass @ 90 Hz
    # ============================================================
    {
        name = libpipewire-module-filter-chain

        args = {
            node.description = "Desktop 2.1 Sub"

            filter.graph = {
                nodes = [
                    # Left channel low-pass
                    {
                        type  = builtin
                        name  = lp1_fl
                        label = bq_lowpass
                        control = { Freq = 90.0 Q = 0.7071 }
                    }
                    {
                        type  = builtin
                        name  = lp2_fl
                        label = bq_lowpass
                        control = { Freq = 90.0 Q = 0.7071 }
                    }

                    # Right channel low-pass
                    {
                        type  = builtin
                        name  = lp1_fr
                        label = bq_lowpass
                        control = { Freq = 90.0 Q = 0.7071 }
                    }
                    {
                        type  = builtin
                        name  = lp2_fr
                        label = bq_lowpass
                        control = { Freq = 90.0 Q = 0.7071 }
                    }
                ]

                links = [
                    { output = "lp1_fl:Out" input = "lp2_fl:In" }
                    { output = "lp1_fr:Out" input = "lp2_fr:In" }
                ]

                inputs  = [ "lp1_fl:In" "lp1_fr:In" ]
                outputs = [ "lp2_fl:Out" "lp2_fr:Out" ]
            }

            capture.props = {
                node.name        = "desktop_21_sub"
                node.description = "Desktop 2.1 Sub"
                media.class      = Audio/Sink

                audio.channels = 2
                audio.position = [ FL FR ]
            }

            playback.props = {
                node.name        = "desktop_21_sub_output"
                node.description = "Desktop 2.1 Sub Output"

                node.passive       = true
                node.dont-fallback = true

                audio.channels = 2
                audio.position = [ FL FR ]

                stream.dont-remix = true

                target.object = "alsa_output.usb-KTMicro_KT_USB_Audio_2021-07-19-0000-0000-0000--00.analog-stereo"
            }
        }
    }


    # ============================================================
    # Main virtual 2.1 system
    # ============================================================
    {
        name = libpipewire-module-combine-stream

        args = {
            combine.mode = sink

            node.name        = "desktop_21"
            node.description = "Desktop 2.1 System"

            combine.latency-compensate = true

            combine.props = {
                audio.channels = 2
                audio.position = [ FL FR ]
            }

            stream.props = {
                stream.dont-remix = true
            }

            stream.rules = [
                {
                    matches = [
                        {
                            media.class = "Audio/Sink"
                            node.name   = "desktop_21_main"
                        }
                    ]
                    actions = {
                        create-stream = {
                            combine.audio.position = [ FL FR ]
                            audio.position         = [ FL FR ]
                        }
                    }
                }
                {
                    matches = [
                        {
                            media.class = "Audio/Sink"
                            node.name   = "desktop_21_sub"
                        }
                    ]
                    actions = {
                        create-stream = {
                            combine.audio.position = [ FL FR ]
                            audio.position         = [ FL FR ]
                        }
                    }
                }
            ]
        }
    }
]
