<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronome Options Explorer</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --sidebar-bg: #181825;
      --card-bg: #1e1e2e;
      --header-bg: #11111b;
      --text: #cdd6f4;
      --text-muted: #a6adc8;
      --border: #313244;
      --accent: #cba6f7;
      --accent-glow: rgba(203, 166, 247, 0.15);
      --blue: #89b4fa;
      --green: #a6e3a1;
      --yellow: #f9e2af;
      --peach: #fab387;
      --surface0: #313244;
      --surface1: #45475a;
      --code-bg: #11111b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--accent);
    }
    .brand span { color: var(--text); font-weight: 400; font-size: 0.95rem; }

    .header-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Main Container */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* Sidebar (Tree View) */
    aside {
      width: 360px;
      min-width: 280px;
      max-width: 500px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tree-search-box {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar-bg);
    }

    .search-input {
      width: 100%;
      background: var(--surface0);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .tree-scope-filters {
      display: flex;
      gap: 0.35rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar-bg);
    }

    .scope-btn {
      flex: 1;
      background: var(--surface0);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      font-size: 0.75rem;
      padding: 0.3rem 0.2rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
      text-align: center;
    }
    .scope-btn.active {
      background: var(--accent);
      color: #11111b;
      border-color: var(--accent);
    }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.25rem 2rem 0.5rem;
    }

    /* Tree Node Elements */
    .tree-node {
      user-select: none;
    }

    .node-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: var(--text);
      transition: background 0.15s, color 0.15s;
    }
    .node-row:hover {
      background: var(--surface0);
    }
    .node-row.active {
      background: var(--surface1);
      color: var(--accent);
      font-weight: 600;
    }

    .toggle-icon {
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .toggle-icon.expanded { transform: rotate(90deg); }
    .toggle-icon.placeholder { visibility: hidden; }

    .node-icon {
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .node-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      letter-spacing: 0.5px;
      margin-left: auto;
    }
    .node-badge.system { color: var(--blue); background: rgba(137, 180, 250, 0.12); }
    .node-badge.user { color: var(--green); background: rgba(166, 227, 161, 0.12); }
    .node-badge.shared { color: var(--yellow); background: rgba(249, 226, 175, 0.12); }

    .tree-children {
      margin-left: 1rem;
      border-left: 1px solid rgba(49, 50, 68, 0.6);
      padding-left: 0.25rem;
      display: none;
    }
    .tree-children.expanded { display: block; }

    /* Right Main Area (Details) */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 2.5rem;
      background: var(--bg);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .breadcrumb span { color: var(--accent); }

    .detail-header {
      margin-bottom: 1.5rem;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .detail-title {
      font-family: monospace;
      font-size: 1.7rem;
      color: var(--text);
      word-break: break-all;
    }

    .scope-banner {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .scope-banner.user {
      background: rgba(166, 227, 161, 0.1);
      border: 1px solid rgba(166, 227, 161, 0.3);
      color: var(--green);
    }
    .scope-banner.system {
      background: rgba(137, 180, 250, 0.1);
      border: 1px solid rgba(137, 180, 250, 0.3);
      color: var(--blue);
    }
    .scope-banner.shared {
      background: rgba(249, 226, 175, 0.1);
      border: 1px solid rgba(249, 226, 175, 0.3);
      color: var(--yellow);
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      margin-top: 1.75rem;
    }

    .desc-box {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.6;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* Code Snippet Box */
    .code-container {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181825;
      padding: 0.4rem 0.85rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .copy-button {
      background: var(--surface0);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
    }
    .copy-button:hover {
      background: var(--accent);
      color: #11111b;
      border-color: var(--accent);
    }

    pre code {
      display: block;
      padding: 1rem 1.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cdd6f4;
      overflow-x: auto;
    }

    /* Meta Table */
    .meta-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .meta-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .meta-table tr:last-child td { border-bottom: none; }
    .meta-table td.label {
      width: 160px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .meta-table td.value {
      font-family: monospace;
      color: var(--peach);
    }

    .folder-summary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }

    .sub-options-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .sub-option-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.85rem;
      background: var(--surface0);
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .sub-option-item:hover { background: var(--surface1); color: var(--accent); }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⚙️ Metronome <span>Options Explorer</span>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <nav style="display: flex; gap: 0.5rem;">
        <a href="index.html" style="background: var(--accent); color: #11111b; border: 1px solid var(--accent); padding: 0.35rem 0.85rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-decoration: none;">📖 Options Reference</a>
        <a href="installed.html" style="background: var(--surface0); color: var(--text-muted); border: 1px solid var(--border); padding: 0.35rem 0.85rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-decoration: none;">💻 Active System & Installed</a>
      </nav>
      <div class="header-stats" id="headerStats">
        Loading options...
      </div>
    </div>
  </header>

  <div class="app-body">
    <!-- Sidebar: Hierarchical Tree -->
    <aside>
      <div class="tree-search-box">
        <input type="text" id="treeSearch" class="search-input" placeholder="Filter options (e.g. mpd, gpu)...">
      </div>
      <div class="tree-scope-filters">
        <button class="scope-btn active" data-scope="all">All</button>
        <button class="scope-btn" data-scope="system">Host</button>
        <button class="scope-btn" data-scope="user">User</button>
        <button class="scope-btn" data-scope="shared">Shared</button>
      </div>
      <div class="tree-container" id="treeRoot">
        <div class="empty-state">Loading tree...</div>
      </div>
    </aside>

    <!-- Main Content Area: Selected Option Details -->
    <main id="detailView">
      <div class="empty-state">
        <h2>Select an option from the left tree</h2>
        <p style="margin-top: 0.5rem;">Explore categories, check types, defaults, and copy declarative Nix snippets.</p>
      </div>
    </main>
  </div>

  <script>
    let optionsData = [];
    let treeRootNode = null;
    let activeScope = 'all';
    let searchQuery = '';
    let selectedPath = null;

    async function init() {
      try {
        let res = await fetch('options.json').catch(() => null);
        if (!res || !res.ok) {
          res = await fetch('docs/options.json');
        }
        if (!res || !res.ok) throw new Error('options.json not found');
        const data = await res.json();
        optionsData = data.options;

        document.getElementById('headerStats').textContent =
          `${data.meta.total} options · ${data.meta.categories.length} categories`;

        buildTree();
        setupSearchAndFilters();
        renderTree();

        // Select first default option if available
        const defaultOpt = optionsData.find(o => o.name === 'metronome.hardware.gpu') || optionsData[0];
        if (defaultOpt) {
          selectNode(defaultOpt.name, defaultOpt);
        }
      } catch (err) {
        document.getElementById('treeRoot').innerHTML = `
          <div class="empty-state">
            <p>⚠️ Failed to load <code>options.json</code></p>
            <p style="font-size: 0.8rem; margin-top: 0.5rem;">Run <code>make</code> to generate it.</p>
          </div>
        `;
      }
    }

    // Build hierarchical tree structure from flat options list
    function buildTree() {
      treeRootNode = { name: 'metronome', fullPath: 'metronome', children: {}, isLeaf: false, option: null };

      optionsData.forEach(opt => {
        const parts = opt.name.split('.');
        let current = treeRootNode;

        for (let i = 1; i < parts.length; i++) {
          const part = parts[i];
          const pathSoFar = parts.slice(0, i + 1).join('.');

          if (!current.children[part]) {
            current.children[part] = {
              name: part,
              fullPath: pathSoFar,
              children: {},
              isLeaf: (i === parts.length - 1),
              option: (i === parts.length - 1) ? opt : null
            };
          } else if (i === parts.length - 1) {
            current.children[part].isLeaf = true;
            current.children[part].option = opt;
          }
          current = current.children[part];
        }
      });
    }

    function setupSearchAndFilters() {
      document.getElementById('treeSearch').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderTree();
      });

      document.querySelectorAll('.scope-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeScope = btn.dataset.scope;
          renderTree();
        });
      });
    }

    // Check if node or any of its descendants matches search & scope
    function nodeMatches(node) {
      if (node.isLeaf && node.option) {
        if (activeScope !== 'all' && node.option.scope !== activeScope) return false;
        if (searchQuery) {
          const matchName = node.option.name.toLowerCase().includes(searchQuery);
          const matchDesc = node.option.description && node.option.description.toLowerCase().includes(searchQuery);
          return matchName || matchDesc;
        }
        return true;
      }

      // Intermediate node
      return Object.values(node.children).some(child => nodeMatches(child));
    }

    function renderTree() {
      const container = document.getElementById('treeRoot');
      container.innerHTML = '';

      const topLevelKeys = Object.keys(treeRootNode.children).sort();
      topLevelKeys.forEach(key => {
        const child = treeRootNode.children[key];
        if (nodeMatches(child)) {
          container.appendChild(createTreeNodeDOM(child));
        }
      });
    }

    function createTreeNodeDOM(node) {
      const hasChildren = Object.keys(node.children).length > 0;
      const wrapper = document.createElement('div');
      wrapper.className = 'tree-node';

      const row = document.createElement('div');
      row.className = `node-row ${selectedPath === node.fullPath ? 'active' : ''}`;

      // Toggle Arrow
      const toggle = document.createElement('span');
      toggle.className = `toggle-icon ${hasChildren ? '' : 'placeholder'}`;
      toggle.textContent = '▶';

      // Icon
      const icon = document.createElement('span');
      icon.className = 'node-icon';
      icon.textContent = hasChildren ? '📁' : (node.option && node.option.type === 'boolean' ? '🔘' : '⚙️');

      // Label
      const label = document.createElement('span');
      label.className = 'node-label';
      label.textContent = node.name;

      row.appendChild(toggle);
      row.appendChild(icon);
      row.appendChild(label);

      // Scope Badge
      if (node.option) {
        const badge = document.createElement('span');
        badge.className = `node-badge ${node.option.scope}`;
        badge.textContent = node.option.scope;
        row.appendChild(badge);
      }

      wrapper.appendChild(row);

      if (hasChildren) {
        const childrenContainer = document.createElement('div');
        childrenContainer.className = 'tree-children';

        // Auto-expand if searching or top level
        const shouldExpand = searchQuery.length > 0 || node.fullPath.split('.').length <= 2;
        if (shouldExpand) {
          childrenContainer.classList.add('expanded');
          toggle.classList.add('expanded');
        }

        const childKeys = Object.keys(node.children).sort();
        childKeys.forEach(ckey => {
          const cnode = node.children[ckey];
          if (nodeMatches(cnode)) {
            childrenContainer.appendChild(createTreeNodeDOM(cnode));
          }
        });

        wrapper.appendChild(childrenContainer);

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const isExp = childrenContainer.classList.toggle('expanded');
          toggle.classList.toggle('expanded', isExp);
        });
      }

      row.addEventListener('click', () => {
        document.querySelectorAll('.node-row').forEach(r => r.classList.remove('active'));
        row.classList.add('active');
        selectedPath = node.fullPath;
        selectNode(node.fullPath, node.option, node);
      });

      return wrapper;
    }

    function selectNode(fullPath, option, node) {
      selectedPath = fullPath;
      const main = document.getElementById('detailView');

      if (option) {
        renderLeafDetail(option);
      } else if (node) {
        renderFolderDetail(node);
      }
    }

    function renderLeafDetail(opt) {
      const main = document.getElementById('detailView');
      const parts = opt.name.split('.');
      const scopeText = {
        system: "Host / NixOS Service (Declare in <code>hosts/&lt;host&gt;/configuration.nix</code>)",
        user: "Userland / Home Manager (Declare in <code>hosts/&lt;host&gt;/users/&lt;user&gt;/packages.nix</code>)",
        shared: "Shared System Slot (Declare in <code>configuration.nix</code> or override in <code>packages.nix</code>)"
      }[opt.scope];

      // Formulate practical example value
      let exampleVal = "true";
      if (opt.type === "boolean") {
        exampleVal = opt.default === "true" ? "false" : "true";
      } else if (opt.type.includes("enum") || opt.type.includes("one of")) {
        const match = opt.type.match(/"([^"]+)"/);
        exampleVal = match ? `"${match[1]}"` : '"value"';
      } else if (opt.type.includes("list")) {
        exampleVal = '[ "item" ]';
      } else if (opt.type.includes("path")) {
        exampleVal = './config.conf';
      } else if (opt.default && opt.default !== "null") {
        exampleVal = opt.default;
      }

      const flatSnippet = `${opt.name} = ${exampleVal};`;

      // Formulate nested Nix snippet
      const nestedSnippet = generateNestedSnippet(opt.name, exampleVal);

      main.innerHTML = `
        <div class="breadcrumb">
          ${parts.map((p, i) => i === parts.length - 1 ? `<span>${p}</span>` : `${p} / `).join('')}
        </div>

        <div class="detail-header">
          <div class="title-row">
            <h1 class="detail-title">${opt.name}</h1>
            <span class="node-badge ${opt.scope}" style="font-size: 0.85rem; padding: 0.3rem 0.7rem;">${opt.scope}</span>
          </div>

          <div class="scope-banner ${opt.scope}">
            <span>📍</span>
            <div>${scopeText}</div>
          </div>
        </div>

        <div class="section-title">Description</div>
        <div class="desc-box">
          ${opt.description || '<em>No description provided in module.</em>'}
        </div>

        <div class="section-title">How To Declare (Nix)</div>

        <div class="code-container">
          <div class="code-header">
            <span>Direct Assignment</span>
            <button class="copy-button" onclick="copySnippet('${escapeQuotes(flatSnippet)}')">📋 Copy</button>
          </div>
          <pre><code>${escapeHtml(flatSnippet)}</code></pre>
        </div>

        <div class="code-container">
          <div class="code-header">
            <span>Nested Block Assignment</span>
            <button class="copy-button" onclick="copySnippet('${escapeQuotes(nestedSnippet)}')">📋 Copy</button>
          </div>
          <pre><code>${escapeHtml(nestedSnippet)}</code></pre>
        </div>

        <div class="section-title">Option Properties</div>
        <table class="meta-table">
          <tr>
            <td class="label">Type</td>
            <td class="value">${escapeHtml(opt.type || 'unspecified')}</td>
          </tr>
          <tr>
            <td class="label">Default</td>
            <td class="value">${escapeHtml(opt.default !== null ? opt.default : 'null')}</td>
          </tr>
          ${opt.example ? `
          <tr>
            <td class="label">Upstream Example</td>
            <td class="value">${escapeHtml(opt.example)}</td>
          </tr>` : ''}
          ${opt.declarations && opt.declarations.length ? `
          <tr>
            <td class="label">Declared in</td>
            <td class="value" style="color: var(--accent);">${opt.declarations.join(', ')}</td>
          </tr>` : ''}
        </table>
      `;
    }

    function renderFolderDetail(node) {
      const main = document.getElementById('detailView');
      const allSubOptions = collectLeaves(node);

      // Generate full nested block for all options in this group
      let blockLines = [];
      allSubOptions.forEach(sub => {
        let val = (sub.type === 'boolean') ? 'true' : (sub.default || '"..."');
        const shortKey = sub.name.replace(node.fullPath + '.', '');
        blockLines.push(`  ${shortKey} = ${val};`);
      });

      const folderSnippet = `${node.fullPath} = {\n${blockLines.join('\n')}\n};`;

      main.innerHTML = `
        <div class="breadcrumb">
          ${node.fullPath.split('.').join(' / ')}
        </div>

        <div class="detail-header">
          <div class="title-row">
            <h1 class="detail-title">${node.fullPath}.*</h1>
            <span class="node-badge" style="background: var(--surface0); color: var(--text);">Namespace</span>
          </div>
          <p style="color: var(--text-muted); margin-top: 0.5rem;">
            Contains ${allSubOptions.length} available options under this configuration module.
          </p>
        </div>

        <div class="section-title">Batch Declaration Template</div>
        <div class="code-container">
          <div class="code-header">
            <span>Nix Module Block</span>
            <button class="copy-button" onclick="copySnippet('${escapeQuotes(folderSnippet)}')">📋 Copy Block</button>
          </div>
          <pre><code>${escapeHtml(folderSnippet)}</code></pre>
        </div>

        <div class="section-title">Options in this namespace</div>
        <div class="sub-options-list">
          ${allSubOptions.map(sub => `
            <div class="sub-option-item" onclick="selectFromList('${sub.name}')">
              <span>${sub.name}</span>
              <span class="node-badge ${sub.scope}">${sub.scope}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function collectLeaves(node) {
      let leaves = [];
      if (node.isLeaf && node.option) leaves.push(node.option);
      Object.values(node.children).forEach(c => {
        leaves = leaves.concat(collectLeaves(c));
      });
      return leaves;
    }

    function selectFromList(optName) {
      const opt = optionsData.find(o => o.name === optName);
      if (opt) {
        selectedPath = opt.name;
        renderTree();
        renderLeafDetail(opt);
      }
    }

    function generateNestedSnippet(optName, val) {
      const parts = optName.split('.');
      if (parts.length <= 1) return `${optName} = ${val};`;

      let indent = '';
      let code = '';
      for (let i = 0; i < parts.length - 1; i++) {
        code += `${indent}${parts[i]} = {\n`;
        indent += '  ';
      }
      code += `${indent}${parts[parts.length - 1]} = ${val};\n`;
      for (let i = parts.length - 2; i >= 0; i--) {
        indent = '  '.repeat(i);
        code += `${indent}};\n`;
      }
      return code.trim();
    }

    function copySnippet(text) {
      navigator.clipboard.writeText(text);
      const btn = event.target.closest('.copy-button');
      if (btn) {
        const oldText = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        setTimeout(() => { btn.innerHTML = oldText; }, 1500);
      }
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') str = JSON.stringify(str);
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeQuotes(str) {
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }

    init();
  </script>
</body>
</html>
