<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronome Radial Bubble Graph</title>
  <style>
    :root {
      --bg: #11111b;
      --card-bg: #181825;
      --text: #cdd6f4;
      --text-muted: #a6adc8;
      --border: #313244;
      --accent: #cba6f7;
      --blue: #89b4fa;
      --green: #a6e3a1;
      --yellow: #f9e2af;
      --peach: #fab387;
      --red: #f38ba8;
      --teal: #94e2d5;
      --pink: #f5c2e7;
      --surface0: #313244;
      --surface1: #45475a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Top Bar */
    header {
      background: rgba(17, 17, 27, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--accent);
    }
    .brand span { color: var(--text); font-weight: 400; font-size: 0.95rem; }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .nav-tab {
      background: var(--surface0);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-tab:hover { background: var(--surface1); color: var(--text); }
    .nav-tab.active {
      background: var(--accent);
      color: #11111b;
      border-color: var(--accent);
    }

    /* Canvas Viewport */
    .viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1e1e2e 0%, #11111b 85%);
      overflow: hidden;
      cursor: grab;
    }
    .viewport:active { cursor: grabbing; }

    svg#graphSvg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Links & Partitions */
    .sector-wedge {
      fill: none;
      stroke: rgba(49, 50, 68, 0.35);
      stroke-dasharray: 4 4;
      stroke-width: 1px;
    }

    .orbit-ring {
      fill: none;
      stroke: rgba(49, 50, 68, 0.4);
      stroke-dasharray: 3 6;
      stroke-width: 1px;
    }

    .graph-link {
      stroke: rgba(203, 166, 247, 0.2);
      stroke-width: 1.5px;
      transition: stroke 0.2s, stroke-width 0.2s;
    }
    .graph-link.active {
      stroke: var(--accent);
      stroke-width: 2.5px;
      filter: drop-shadow(0 0 6px rgba(203, 166, 247, 0.8));
    }

    /* Bubble Nodes */
    .bubble-node {
      cursor: pointer;
      transition: transform 0.15s;
    }

    .bubble-circle {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .bubble-node:hover .bubble-circle {
      transform: scale(1.15);
      filter: drop-shadow(0 0 16px var(--glow-color, rgba(203, 166, 247, 0.7)));
    }

    .bubble-node.center-root .bubble-circle {
      animation: pulseGlow 3s infinite alternate;
    }
    @keyframes pulseGlow {
      from { filter: drop-shadow(0 0 12px rgba(203, 166, 247, 0.5)); }
      to { filter: drop-shadow(0 0 26px rgba(203, 166, 247, 0.9)); }
    }

    .bubble-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: var(--text);
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .bubble-node.center-root .bubble-label {
      font-size: 14px;
      font-weight: 800;
      fill: #ffffff;
    }
    .bubble-node.leaf .bubble-label {
      font-size: 9.5px;
      fill: var(--text-muted);
    }

    /* Floating Toolbar */
    .toolbar {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(24, 24, 37, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .tool-btn {
      background: var(--surface0);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: var(--surface1); border-color: var(--accent); }

    .search-box {
      background: var(--surface0);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      outline: none;
      width: 180px;
    }
    .search-box:focus { border-color: var(--accent); width: 220px; transition: width 0.2s; }

    /* Legend */
    .sector-legend {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      background: rgba(24, 24, 37, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      max-width: 500px;
      font-size: 0.75rem;
      z-index: 20;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-muted);
    }
    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Inspector Card Drawer (Bottom-Right) */
    .inspector-card {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 380px;
      background: rgba(24, 24, 37, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 30;
      display: none;
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .inspector-title {
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
    }
    .close-btn:hover { color: var(--text); }

    .inspector-desc {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 0.75rem;
      max-height: 100px;
      overflow-y: auto;
    }

    .snippet-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--peach);
      margin-bottom: 0.75rem;
      position: relative;
    }

    .copy-chip {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--surface0);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .copy-chip:hover { color: var(--accent); border-color: var(--accent); }

    .inspector-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      max-width: 420px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .crumb-item {
      cursor: pointer;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .crumb-item:hover { background: var(--surface1); color: var(--accent); }
    .crumb-item.current { color: var(--accent); font-weight: 700; pointer-events: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⏱️ Metronome <span>Radial Bubble Graph</span>
    </div>
    <nav class="nav-tabs">
      <a href="index.html" class="nav-tab">📖 Options Reference</a>
      <a href="installed.html" class="nav-tab">💻 System Dashboard</a>
      <a href="tree.html" class="nav-tab active">🫧 Bubble Graph</a>
    </nav>
  </header>

  <div class="viewport" id="viewport">
    <svg id="graphSvg">
      <g id="zoomLayer">
        <!-- Background Partition Guides -->
        <g id="guidesLayer"></g>
        <!-- Links / Branches -->
        <g id="linksLayer"></g>
        <!-- Interactive Bubble Nodes -->
        <g id="nodesLayer"></g>
      </g>
    </svg>

    <!-- Floating Top Toolbar with Drill-down Navigation -->
    <div class="toolbar">
      <button class="tool-btn" id="btnBack" style="display: none;">⬅️ Up</button>
      <div id="breadcrumbBar" class="breadcrumbs"></div>
      <input type="text" id="treeSearch" class="search-box" placeholder="Search option (e.g. gpu, mpd)...">
      <button class="tool-btn" id="btnCenter">Center</button>
    </div>

    <!-- Sector Color Legend -->
    <div class="sector-legend" id="legendContainer"></div>

    <!-- Inspector Modal Drawer -->
    <div class="inspector-card" id="inspectorCard">
      <div class="inspector-header">
        <div class="inspector-title" id="inspTitle">metronome.*</div>
        <button class="close-btn" id="inspClose">×</button>
      </div>
      <div class="inspector-desc" id="inspDesc">No description available.</div>
      <div class="snippet-box">
        <span id="inspSnippet">metronome = {};</span>
        <button class="copy-chip" id="inspCopy">📋 Copy</button>
      </div>
      <div class="inspector-meta">
        <span id="inspType">Type: boolean</span>
        <span id="inspScope">Scope: user</span>
      </div>
    </div>
  </div>

  <script>
    let optionsData = [];
    let treeRoot = null;
    let currentRoot = null;
    let allNodes = [];
    let allLinks = [];

    let transform = { x: 0, y: 0, scale: 0.85 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    // Partition Category Palette
    const CAT_COLORS = {
      apps: { fill: '#89b4fa', glow: 'rgba(137, 180, 250, 0.7)' },
      defaults: { fill: '#f9e2af', glow: 'rgba(249, 226, 175, 0.7)' },
      hardware: { fill: '#fab387', glow: 'rgba(250, 179, 135, 0.7)' },
      services: { fill: '#a6e3a1', glow: 'rgba(166, 227, 161, 0.7)' },
      networking: { fill: '#94e2d5', glow: 'rgba(148, 226, 213, 0.7)' },
      profiles: { fill: '#cba6f7', glow: 'rgba(203, 166, 247, 0.7)' },
      theme: { fill: '#f38ba8', glow: 'rgba(243, 139, 168, 0.7)' }
    };

    // Radii for partitioned orbits
    const R_CAT = 190;
    const R_SUB = 340;
    const R_LEAF = 480;

    async function init() {
      try {
        let res = await fetch('options.json').catch(() => null);
        if (!res.ok) res = await fetch('docs/options.json');
        if (!res.ok) throw new Error('options.json not found');
        const data = await res.json();
        optionsData = data.options;

        buildHierarchy();
        currentRoot = treeRoot;

        setupLegend();
        setupPanZoom();
        setupToolbar();
        setupSearch();

        updateBreadcrumbs();
        layoutGraph(currentRoot);
        centerOnRoot();
      } catch (err) {
        console.error(err);
      }
    }

    function buildHierarchy() {
      treeRoot = {
        id: 'metronome',
        name: 'metronome',
        fullName: 'metronome',
        depth: 0,
        isRoot: true,
        parent: null,
        category: null,
        radius: 38,
        color: '#cba6f7',
        glow: 'rgba(203, 166, 247, 0.9)',
        children: {},
        option: null
      };

      optionsData.forEach(opt => {
        const parts = opt.name.split('.');
        let current = treeRoot;

        for (let i = 1; i < parts.length; i++) {
          const part = parts[i];
          const path = parts.slice(0, i + 1).join('.');
          const isCategory = (i === 1);
          const isLeaf = (i === parts.length - 1);
          const cat = parts[1];

          if (!current.children[part]) {
            const catTheme = CAT_COLORS[cat] || { fill: '#cdd6f4', glow: 'rgba(205, 214, 244, 0.5)' };
            current.children[part] = {
              id: path,
              name: part,
              fullName: path,
              depth: i,
              parent: current,
              category: cat,
              isRoot: false,
              isCategory: isCategory,
              isLeaf: isLeaf,
              radius: isCategory ? 26 : (isLeaf ? 14 : 20),
              color: catTheme.fill,
              glow: catTheme.glow,
              children: {},
              option: isLeaf ? opt : null
            };
          } else if (isLeaf) {
            current.children[part].option = opt;
          }
          current = current.children[part];
        }
      });
    }

    function setRoot(node) {
      if (!node) return;
      currentRoot = node;
      updateBreadcrumbs();
      layoutGraph(currentRoot);
      centerOnRoot();
    }

    function updateBreadcrumbs() {
      const container = document.getElementById('breadcrumbBar');
      const btnBack = document.getElementById('btnBack');
      container.innerHTML = '';

      let path = [];
      let curr = currentRoot;
      while (curr) {
        path.unshift(curr);
        curr = curr.parent;
      }

      btnBack.style.display = currentRoot.parent ? 'inline-block' : 'none';

      path.forEach((n, idx) => {
        const isLast = (idx === path.length - 1);
        const span = document.createElement('span');
        span.className = `crumb-item ${isLast ? 'current' : ''}`;
        span.textContent = n.name;
        if (!isLast) {
          span.onclick = () => setRoot(n);
        }
        container.appendChild(span);
        if (!isLast) {
          const sep = document.createElement('span');
          sep.textContent = '/';
          sep.style.color = 'var(--surface1)';
          container.appendChild(sep);
        }
      });
    }

    // Radial Layout: Focus on currentRoot at (0, 0), and fan out its children
    function layoutGraph(focusNode) {
      allNodes = [];
      allLinks = [];

      focusNode.x = 0;
      focusNode.y = 0;
      allNodes.push(focusNode);

      const childKeys = Object.keys(focusNode.children).sort();
      const numKids = childKeys.length;

      // Mode A: Root view (metronome showing all 8 sectors)
      if (focusNode === treeRoot) {
        const sectorAngle = (2 * Math.PI) / numKids;

        childKeys.forEach((catKey, catIdx) => {
          const catNode = focusNode.children[catKey];
          const centerAngle = (catIdx * sectorAngle) - Math.PI / 2;

          catNode.x = R_CAT * Math.cos(centerAngle);
          catNode.y = R_CAT * Math.sin(centerAngle);
          catNode.angle = centerAngle;

          allNodes.push(catNode);
          allLinks.push({ source: focusNode, target: catNode, color: catNode.color });

          // Level 2 Sub-nodes
          const subKeys = Object.keys(catNode.children).sort();
          const numSubs = subKeys.length;
          if (numSubs === 0) return;

          const maxSpan = sectorAngle * 0.85;
          const subStep = numSubs > 1 ? (maxSpan / (numSubs - 1)) : 0;
          const startSubAngle = numSubs > 1 ? (centerAngle - maxSpan / 2) : centerAngle;

          subKeys.forEach((subKey, subIdx) => {
            const subNode = catNode.children[subKey];
            const subAngle = numSubs > 1 ? (startSubAngle + subIdx * subStep) : centerAngle;

            subNode.x = R_SUB * Math.cos(subAngle);
            subNode.y = R_SUB * Math.sin(subAngle);
            subNode.angle = subAngle;

            allNodes.push(subNode);
            allLinks.push({ source: catNode, target: subNode, color: catNode.color });

            // Level 3 Leaves
            const leafKeys = Object.keys(subNode.children).sort();
            const numLeaves = leafKeys.length;
            if (numLeaves === 0) return;

            const leafSpan = (subStep > 0 ? subStep * 0.9 : sectorAngle * 0.4);
            const leafStep = numLeaves > 1 ? (leafSpan / (numLeaves - 1)) : 0;
            const startLeafAngle = numLeaves > 1 ? (subAngle - leafSpan / 2) : subAngle;

            leafKeys.forEach((leafKey, leafIdx) => {
              const leafNode = subNode.children[leafKey];
              const leafAngle = numLeaves > 1 ? (startLeafAngle + leafIdx * leafStep) : subAngle;

              leafNode.x = R_LEAF * Math.cos(leafAngle);
              leafNode.y = R_LEAF * Math.sin(leafAngle);

              allNodes.push(leafNode);
              allLinks.push({ source: subNode, target: leafNode, color: catNode.color });
            });
          });
        });
      } else {
        // Mode B: Focused on a specific category or sub-app (Only show its children!)
        const r1 = Math.min(240, Math.max(160, numKids * 16));
        const stepAngle = (2 * Math.PI) / Math.max(1, numKids);

        childKeys.forEach((ck, idx) => {
          const child = focusNode.children[ck];
          const angle = idx * stepAngle - Math.PI / 2;

          child.x = r1 * Math.cos(angle);
          child.y = r1 * Math.sin(angle);
          child.angle = angle;

          allNodes.push(child);
          allLinks.push({ source: focusNode, target: child, color: child.color });

          // Grandchildren (leaves under this child)
          const grandKeys = Object.keys(child.children).sort();
          const numGrand = grandKeys.length;
          if (numGrand > 0) {
            const r2 = r1 + 140;
            const span = Math.min(stepAngle * 0.85, 0.7);
            const gStep = numGrand > 1 ? span / (numGrand - 1) : 0;
            const gStart = numGrand > 1 ? angle - span / 2 : angle;

            grandKeys.forEach((gk, gIdx) => {
              const gChild = child.children[gk];
              const gAngle = numGrand > 1 ? gStart + gIdx * gStep : angle;

              gChild.x = r2 * Math.cos(gAngle);
              gChild.y = r2 * Math.sin(gAngle);

              allNodes.push(gChild);
              allLinks.push({ source: child, target: gChild, color: child.color });
            });
          }
        });
      }

      renderSVG();
    }

    function renderSVG() {
      const guidesLayer = document.getElementById('guidesLayer');
      const linksLayer = document.getElementById('linksLayer');
      const nodesLayer = document.getElementById('nodesLayer');

      guidesLayer.innerHTML = '';
      linksLayer.innerHTML = '';
      nodesLayer.innerHTML = '';

      // Draw Orbit Rings & Sector Dividers
      const maxR = currentRoot === treeRoot ? R_LEAF : 360;
      [180, maxR].forEach(r => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', 0);
        circle.setAttribute('cy', 0);
        circle.setAttribute('r', r);
        circle.setAttribute('class', 'orbit-ring');
        guidesLayer.appendChild(circle);
      });

      if (currentRoot === treeRoot) {
        const numCats = Object.keys(treeRoot.children).length;
        const sectorAngle = (2 * Math.PI) / numCats;
        for (let i = 0; i < numCats; i++) {
          const wedgeAngle = (i * sectorAngle) - Math.PI / 2 + sectorAngle / 2;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', 0);
          line.setAttribute('y1', 0);
          line.setAttribute('x2', (R_LEAF + 50) * Math.cos(wedgeAngle));
          line.setAttribute('y2', (R_LEAF + 50) * Math.sin(wedgeAngle));
          line.setAttribute('class', 'sector-wedge');
          guidesLayer.appendChild(line);
        }
      }

      // Draw Graph Links
      allLinks.forEach(link => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const midX = (link.source.x + link.target.x) / 2;
        const midY = (link.source.y + link.target.y) / 2;
        const pathData = `M ${link.source.x} ${link.source.y} Q ${midX} ${midY} ${link.target.x} ${link.target.y}`;

        path.setAttribute('d', pathData);
        path.setAttribute('class', 'graph-link');
        path.setAttribute('stroke', link.color);
        path.setAttribute('stroke-opacity', '0.3');
        link.element = path;
        linksLayer.appendChild(path);
      });

      // Draw Bubble Nodes
      allNodes.forEach(node => {
        const isCurrentCenter = (node === currentRoot);
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        let classes = 'bubble-node';
        if (isCurrentCenter) classes += ' center-root';
        else if (node.isCategory) classes += ' category';
        else if (node.isLeaf) classes += ' leaf';

        g.setAttribute('class', classes);
        g.setAttribute('transform', `translate(${node.x}, ${node.y})`);
        g.style.setProperty('--glow-color', node.glow || 'rgba(203, 166, 247, 0.7)');

        // Circle
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const radius = isCurrentCenter ? 36 : (node.radius || 18);
        circle.setAttribute('r', radius);
        circle.setAttribute('class', 'bubble-circle');
        circle.setAttribute('fill', isCurrentCenter ? '#2a2040' : '#181825');
        circle.setAttribute('stroke', node.color);
        circle.setAttribute('stroke-width', isCurrentCenter ? '3.5px' : '2px');
        g.appendChild(circle);

        // Label
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('class', 'bubble-label');
        text.textContent = node.name;
        g.appendChild(text);

        // Click: Center on this item and show only its children!
        g.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isCurrentCenter) {
            // Clicking center hub zooms up to parent
            if (node.parent) setRoot(node.parent);
          } else if (Object.keys(node.children).length > 0) {
            // Clicking child drills down and centers it!
            setRoot(node);
          }
          inspectNode(node);
        });

        // Hover highlight
        g.addEventListener('mouseenter', () => highlightBranch(node, true));
        g.addEventListener('mouseleave', () => highlightBranch(node, false));

        nodesLayer.appendChild(g);
      });
    }

    function highlightBranch(node, active) {
      allLinks.forEach(l => {
        if (l.target === node || l.source === node) {
          l.element.classList.toggle('active', active);
        }
      });
    }

    function inspectNode(node) {
      const card = document.getElementById('inspectorCard');
      const title = document.getElementById('inspTitle');
      const desc = document.getElementById('inspDesc');
      const snippet = document.getElementById('inspSnippet');
      const typeSpan = document.getElementById('inspType');
      const scopeSpan = document.getElementById('inspScope');

      title.textContent = node.fullName;

      if (node.option) {
        desc.textContent = node.option.description || 'No description provided in module.';
        let val = node.option.type === 'boolean' ? 'true' : (node.option.default || '"value"');
        snippet.textContent = `${node.fullName} = ${val};`;
        typeSpan.textContent = `Type: ${node.option.type || 'unknown'}`;
        scopeSpan.textContent = `Scope: ${node.option.scope}`;
      } else {
        const count = countLeaves(node);
        desc.textContent = `Partitioned namespace with ${count} configuration options. Click node to center and inspect children.`;
        snippet.textContent = `${node.fullName} = { ... };`;
        typeSpan.textContent = `Branch: ${node.name}`;
        scopeSpan.textContent = `Options: ${count}`;
      }

      card.style.display = 'block';
    }

    function countLeaves(node) {
      if (node.option) return 1;
      let total = 0;
      Object.values(node.children).forEach(c => total += countLeaves(c));
      return total;
    }

    function setupLegend() {
      const container = document.getElementById('legendContainer');
      Object.entries(CAT_COLORS).forEach(([cat, theme]) => {
        const item = document.createElement('div');
        item.className = 'leg-item';
        item.style.cursor = 'pointer';
        item.innerHTML = `<span class="leg-dot" style="background: ${theme.fill}"></span><span>${cat}</span>`;
        item.onclick = () => {
          if (treeRoot.children[cat]) setRoot(treeRoot.children[cat]);
        };
        container.appendChild(item);
      });
    }

    function setupPanZoom() {
      const vp = document.getElementById('viewport');
      const zoomLayer = document.getElementById('zoomLayer');

      vp.addEventListener('mousedown', (e) => {
        if (e.target.closest('#inspectorCard') || e.target.closest('.toolbar') || e.target.closest('.sector-legend')) return;
        isDragging = true;
        dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        transform.x = e.clientX - dragStart.x;
        transform.y = e.clientY - dragStart.y;
        updateTransform();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      vp.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const newScale = Math.min(Math.max(transform.scale * zoomFactor, 0.2), 3);

        const rect = vp.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
        transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
        transform.scale = newScale;
        updateTransform();
      }, { passive: false });
    }

    function updateTransform() {
      const zoomLayer = document.getElementById('zoomLayer');
      zoomLayer.setAttribute('transform', `translate(${transform.x}, ${transform.y}) scale(${transform.scale})`);
    }

    function centerOnRoot() {
      const vp = document.getElementById('viewport');
      const maxR = currentRoot === treeRoot ? R_LEAF : 340;
      transform.scale = Math.min(1.0, (vp.clientHeight - 80) / (maxR * 2.2));
      transform.x = vp.clientWidth / 2;
      transform.y = vp.clientHeight / 2;
      updateTransform();
    }

    function setupToolbar() {
      document.getElementById('btnCenter').addEventListener('click', centerOnRoot);

      document.getElementById('btnBack').addEventListener('click', () => {
        if (currentRoot && currentRoot.parent) {
          setRoot(currentRoot.parent);
        }
      });

      document.getElementById('inspClose').addEventListener('click', () => {
        document.getElementById('inspectorCard').style.display = 'none';
      });

      document.getElementById('inspCopy').addEventListener('click', () => {
        const text = document.getElementById('inspSnippet').textContent;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('inspCopy');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy'; }, 1500);
      });
    }

    function setupSearch() {
      document.getElementById('treeSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        if (!q) {
          allNodes.forEach(n => {
            const el = document.querySelector(`[transform="translate(${n.x}, ${n.y})"] circle`);
            if (el) el.setAttribute('stroke', n.color);
          });
          return;
        }

        allNodes.forEach(n => {
          const match = n.fullName.toLowerCase().includes(q);
          const el = document.querySelector(`[transform="translate(${n.x}, ${n.y})"] circle`);
          if (el) {
            el.setAttribute('stroke', match ? '#ffffff' : 'rgba(49, 50, 68, 0.4)');
            if (match) el.setAttribute('stroke-width', '4px');
            else el.setAttribute('stroke-width', '1.5px');
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
